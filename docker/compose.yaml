# OpenGewerk Haustechnik for operation. One command, and an empty machine runs
# a migrated instance:
#
#   sh docker/start.sh
#
# The scripts behind it are the foundation's (upstream/opengewerk/docker, ADR
# 0010 in the repository opengewerk): setup.sh fills in the .env, start.sh
# migrates and then starts, in the order of an update. What they need to know
# about this application stands in application.env beside this file and here.
#
# Six services. The database, the application and the nightly backup run at
# all times, and so does the renderer unless the .env switches it off; the
# migration exits when it is done, and the backup by hand sits in a profile.
# The order is not a convenience: the database has to answer before anything
# migrates, and the migration has to be through before the application starts.
#
# Side by side with an OpenGewerk on the same server (opengewerk-haustechnik
# #15): a project name, a port, a database and volumes of its own, and a host
# name of its own in front of it, because a browser keeps cookies per host name
# and not per port.

name: opengewerk-haustechnik

# Where every service below logs to, with a limit: without one Docker writes
# json-file without rotation until the disk is full. Five files of 10 MB per
# container at most. A new service takes the same line, and the CI checks that
# none is without it.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '5'

# What every service below may do beyond running its own program: nothing
# (opengewerk#688 in the foundation, for #360). No capability of root, not even
# those Docker grants by default, and no way to gain one through a setuid
# binary. A service that needs one names it in cap_add and says why. Beside it,
# at each service, a root file system nothing can write to, wherever the
# service runs with one; where it does not, the reason stands there. A new
# service takes the same line, and the CI checks that none is without it.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  postgres:
    # By its digest (#687 in the repository opengewerk): a tag names whatever
    # was pushed under it last. The backup of the foundation is built on the
    # very same image, and "test-stack.sh base-images" stays red until a
    # raised submodule and this line name the same one.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    # As the user the image runs PostgreSQL as, from the first command on. As
    # root, the entrypoint of the image would first hand the data directory to
    # that user and then change to it, and both take capabilities. The data
    # directory has belonged to that user since the first start of every
    # installation, and the scripts of the foundation in postgres-init only
    # have to be readable for it.
    user: postgres
    read_only: true
    # What PostgreSQL writes outside its data directory: its socket with the
    # lock beside it.
    tmpfs:
      - /var/run/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env-Datei}
      POSTGRES_DB: haustechnik
      # The script of the foundation below creates the two roles and reads
      # their passwords under these names; the values are this application's.
      OPENGEWERK_OWNER_PASSWORD: ${HAUSTECHNIK_OWNER_PASSWORD:?HAUSTECHNIK_OWNER_PASSWORD fehlt in der .env-Datei}
      OPENGEWERK_APP_PASSWORD: ${HAUSTECHNIK_APP_PASSWORD:?HAUSTECHNIK_APP_PASSWORD fehlt in der .env-Datei}
    volumes:
      # On /var/lib/postgresql, not on .../data: the images from PostgreSQL 18
      # on put the data in a subdirectory per major version, and a volume on
      # the old path keeps the container from starting at all.
      - database:/var/lib/postgresql
      # Creates the two roles, once, on the first start, with the script of the
      # foundation rather than a copy of it. After that the data lives in the
      # volume and this directory is never looked at again.
      - ../upstream/opengewerk/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # No published port. Whoever wants psql takes
    # "docker compose -f docker/compose.yaml exec postgres psql".
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d haustechnik']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Brings the database up to date and exits. Runs on every "up": against a
  # database that is already current it does nothing. An update calls it on
  # its own first, which start.sh does, because "up" alone recreates the
  # serving container before the migration has even started.
  #
  # Its own service, because it signs in as the owner of the tables. The
  # application never sees those credentials.
  #
  # The image a release will publish, under its version; until the first one
  # a checkout builds it under the tag "source".
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/opengewerk/opengewerk-haustechnik:${HAUSTECHNIK_VERSION:-source}
    logging: *logging
    <<: *hardening
    read_only: true
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgres://opengewerk_owner:${HAUSTECHNIK_OWNER_PASSWORD}@postgres:5432/haustechnik
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/opengewerk/opengewerk-haustechnik:${HAUSTECHNIK_VERSION:-source}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    # It writes into the file store below and nowhere else.
    read_only: true
    # The network of every service, and the one it shares with the renderer
    # alone (#686 in the repository opengewerk).
    networks:
      - default
      - printing
    # The most memory the application may take, swap included. Past it, Docker
    # ends the application and starts it again; without a limit, the kernel of
    # a machine that runs out ends whichever process it picks, and that can be
    # the database. The largest work of this application is the bundle of the
    # evidence of a duty, up to 200 MB of PDFs merged in memory; 4 GB carry it
    # with room to spare. HAUSTECHNIK_MEMORY_LIMIT in the .env sets another,
    # and the heap follows it, see NODE_OPTIONS below.
    mem_limit: ${HAUSTECHNIK_MEMORY_LIMIT:-4g}
    memswap_limit: ${HAUSTECHNIK_MEMORY_LIMIT:-4g}
    environment:
      # Three quarters of the limit above for the heap, so that a heap that
      # runs full ends in a message of its own before the container reaches
      # the limit, and what Node keeps outside the heap, the bytes of files
      # above all, has the rest. A percentage and no number, so that it
      # follows the limit wherever the .env moves it.
      NODE_OPTIONS: --max-old-space-size-percentage=75
      # opengewerk_app, never opengewerk_owner: for the owner of the tables
      # row level security applies only through FORCE. The application refuses
      # an address carrying the wrong role at startup.
      DATABASE_URL: postgres://opengewerk_app:${HAUSTECHNIK_APP_PASSWORD}@postgres:5432/haustechnik
      PORT: '23800'
      # Where the renderer listens. The address stands here even when its
      # profile is switched off: nobody answers then, and an attempt at a PDF
      # gets the message that the service is not running rather than the one
      # saying none is set up. The first is the true one.
      RENDERER_URL: http://renderer:3000
      RENDERER_TOKEN: ${RENDERER_TOKEN:-}
      # The content addressed file store: the documents and photos a Betreiber
      # files, and every PDF once it has been printed. The application refuses
      # to start when it cannot write here, because a wrong mount otherwise
      # shows up as the first lost file rather than as an error. The volume
      # behind it is in every backup.
      STORAGE_PATH: /var/lib/opengewerk-haustechnik/storage
      # Signs the session cookies and encrypts the second factors. Changing it
      # signs everybody out, so it belongs in the backup of an installation.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt in der .env-Datei}
      # The addresses a browser may send an authenticated request from. No
      # default on purpose: one would switch the protection off in exactly the
      # installation whose operator did not think about it.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?TRUSTED_ORIGINS fehlt in der .env-Datei}
      # The code the first run asks for. Optional here on purpose: an instance
      # that has been set up never needs it again and starts without it.
      SETUP_CODE: ${SETUP_CODE:-}
      # The key push messages are signed with. Optional: without it the
      # instance sends no push and says so under "Konto".
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # Recognises nobody while this is on, the sign in included.
      CLOSED: ${CLOSED:-false}
      # The version the image above runs, from the same expression, for the
      # health check. A checkout says "source", which the application takes
      # for no version at all.
      HAUSTECHNIK_VERSION: ${HAUSTECHNIK_VERSION:-source}
      # When the last backup finished. Only this record, read-only: the
      # archives themselves hold every Betreiber and stay out of reach of the
      # application.
      BACKUP_STATUS_PATH: /var/lib/opengewerk-haustechnik/backup-status
    volumes:
      - files:/var/lib/opengewerk-haustechnik/storage
      - backup-status:/var/lib/opengewerk-haustechnik/backup-status:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Loopback only. A reverse proxy terminating TLS belongs in front of it,
    # under a host name of its own.
    ports:
      - '127.0.0.1:${HAUSTECHNIK_PORT:-23800}:23800'

  # Chromium for turning a page into a PDF, a container of its own and not
  # part of the application process (ADR 0007 in the repository opengewerk):
  # Chromium in the same process would cost more memory than the whole
  # application is allowed to use.
  #
  # Starts with the instance: the .env switches its profile on with
  # COMPOSE_PROFILES=renderer, and the template ships it that way, because an
  # installation without it cannot hand out a single PDF. Left empty there, it
  # stays off:
  #
  #   COMPOSE_PROFILES=
  #
  # Without it everything else keeps running, and an attempt at a PDF gets a
  # readable message instead of a crash. Switched off, it saves close to 4 GB
  # of disk and around 340 MB of memory.
  #
  # Pinned to a release and its digest, the ones the foundation names in
  # upstream/opengewerk/docker/compose.yaml: the pages are built with the
  # foundation's helpers and printed in its CI with exactly this Chromium. An
  # update is a pull request that raises the submodule and changes this line
  # with it; a step of the CI checks that both name the same image, and the
  # check of the widths takes its browser from this line too.
  renderer:
    image: ghcr.io/browserless/chromium:v2.57.3@sha256:40dff7c23e0e378ba451c23ef66394ffb81bd11e6b9fe8ef3066d59eb402cc5d
    restart: unless-stopped
    profiles: ['renderer']
    logging: *logging
    <<: *hardening
    # Chromium runs without its own sandbox in this image, so it needs neither
    # a capability nor a setuid helper. What it and the service write, the
    # lock of the virtual display and a profile per job, lies in /tmp and
    # goes with every restart.
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Chromium keeps its settings, its cache and the database of its crash
      # handler below the home directory of the image, and that is read-only
      # here: without these two it does not start at all
      # ("chrome_crashpad_handler: --database is required"). In /tmp instead.
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      # The service wants a token, even on its own network. It sits in the
      # .env file and reaches the application as RENDERER_TOKEN.
      TOKEN: ${RENDERER_TOKEN:?RENDERER_TOKEN fehlt in der .env-Datei}
      # One browser per job, and two minutes is the end of it. A PDF of a
      # protocol takes seconds; anything beyond that is stuck and should give
      # up.
      CONCURRENT: '1'
      TIMEOUT: '120000'
      # The largest page the service takes. Every photo of a round is embedded,
      # kept at a long edge of 2048 pixels and up to 3 MB, a third more as
      # text; the default of 10 MiB refused a round with about ten of them.
      # 96 MiB stays below what Chromium takes over its DevTools connection,
      # 100 MiB: past that the service fails with an error that names no
      # reason, below it a page that is too large is refused with its size.
      MAX_PAYLOAD_SIZE: '100663296'
    # No published port either. It hangs in a network of its own with the
    # application and nothing else (#686 in the repository opengewerk, found in
    # the security review #360): Chromium prints what it is handed, and should a
    # page ever ask for more than it carries, there is no database to reach and,
    # the network being internal, no internet either.
    networks:
      - printing

  # Backup and restore by hand, with the image of the foundation's backup:
  #
  #   docker compose -f docker/compose.yaml --profile backup run --rm backup backup.sh
  #   docker compose -f docker/compose.yaml --profile backup run --rm backup restore.sh latest
  #
  # Built on the database image so that pg_dump always matches the server.
  # Connects as the superuser: row level security is FORCEd on every table and
  # applies to the owner too, so a dump taken as anybody else comes back
  # refused or empty. The archives are named after the database, haustechnik,
  # so a target shared with an OpenGewerk keeps both apart.
  backup:
    build:
      context: ../upstream/opengewerk/docker/backup
    image: ghcr.io/opengewerk/opengewerk-haustechnik-backup:${HAUSTECHNIK_VERSION:-source}
    profiles: ['backup']
    logging: *logging
    <<: *hardening
    # As root, and with a writable root file system, both for a reason. The
    # archives, the record of the backups and a target of the operator's
    # choosing belong to root, and a restore hands the file store back to the
    # user of the application. A backup writes its parts inside the container
    # before they are packed, a dump and a copy of the file store, and those
    # can come to gigabytes: in a tmpfs they would lie in memory, in a volume
    # they would outlive a killed run, while the writable layer goes with the
    # container. Of the capabilities of root it keeps three: CHOWN for handing
    # the restored files to the application, DAC_OVERRIDE for writing into the
    # file store of that user and into a target such as a share that belongs to
    # somebody else, FOWNER for setting the times and modes of what it
    # restores there.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    environment: &backup-environment
      POSTGRES_HOST: postgres
      POSTGRES_DB: haustechnik
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env-Datei}
      # restore.sh of the foundation plays the dump back as the owner of the
      # tables and not as the superuser, so that a dump can do no more than a
      # migration could (#360). The superuser above locks the application out
      # and reads every Betreiber for the checks. The schedule, which only
      # backs up, inherits this with the rest of the anchor; it holds the
      # password of the superuser anyway, which can do more than the owner.
      OPENGEWERK_OWNER_PASSWORD: ${HAUSTECHNIK_OWNER_PASSWORD:?HAUSTECHNIK_OWNER_PASSWORD fehlt in der .env-Datei}
      STORAGE_PATH: /var/lib/opengewerk-haustechnik/storage
      BACKUP_PATH: /var/lib/opengewerk-haustechnik/backups
      BACKUP_STATUS_PATH: /var/lib/opengewerk-haustechnik/backup-status
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # The public key an archive is encrypted to. Without it the archive is
      # written in the clear.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # Only a restore needs this, and only for an encrypted archive. It
      # points at a key file, which is why the key itself never stands in the
      # .env next to the data it protects.
      BACKUP_AGE_IDENTITY: ${BACKUP_AGE_IDENTITY:-}
    volumes:
      - files:/var/lib/opengewerk-haustechnik/storage
      - ${BACKUP_TARGET:-backups}:/var/lib/opengewerk-haustechnik/backups
      - backup-status:/var/lib/opengewerk-haustechnik/backup-status
    depends_on:
      postgres:
        condition: service_healthy

  # The backup every night, at the hour the area of the instance sets, 02:30
  # unless somebody changed it. Runs with the instance and not in a profile: a
  # backup that has to be switched on is missing on the day it is needed. Why
  # it catches up and why it skips an instance without a Betreiber stands in
  # schedule.sh of the foundation.
  backup-schedule:
    build:
      context: ../upstream/opengewerk/docker/backup
    image: ghcr.io/opengewerk/opengewerk-haustechnik-backup:${HAUSTECHNIK_VERSION:-source}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    # As root and with a writable root file system for the reasons at the
    # service above. It only backs up and never restores, so of the
    # capabilities it keeps DAC_OVERRIDE alone, for a target that belongs to
    # somebody else.
    cap_add: [DAC_OVERRIDE]
    command: ['schedule.sh']
    environment:
      <<: *backup-environment
      TZ: Europe/Berlin
    volumes:
      # Read-only: a backup reads the files and never writes them.
      - files:/var/lib/opengewerk-haustechnik/storage:ro
      - ${BACKUP_TARGET:-backups}:/var/lib/opengewerk-haustechnik/backups
      - backup-status:/var/lib/opengewerk-haustechnik/backup-status
    # After the migration, like the application: the schedule checks at once
    # when it starts, and before the migration there is not even a table of
    # Betreiber to ask.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  # The one Compose makes for every service that names no other.
  default:
  # The renderer and the application, and nothing else (#686 in the repository
  # opengewerk). Internal, so that nothing on it reaches beyond the host.
  printing:
    internal: true

volumes:
  database:
  files:
  # Where the archives land by default. An installation that means it points
  # BACKUP_TARGET at a path on another machine, because a backup on the same
  # disk as the data survives a mistake and not a disk.
  backups:
  # The record of the last backup, written by the backup services and read by
  # the application. A few hundred bytes.
  backup-status:
