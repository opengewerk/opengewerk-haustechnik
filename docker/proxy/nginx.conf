# Vorlage für nginx vor OpenGewerk Haustechnik: die Weiterleitung von HTTP auf
# HTTPS und der Reverse Proxy auf die Anwendung. Warum die Zeilen so sind, steht
# im README im Abschnitt "Reverse Proxy".
#
# So wird sie eingesetzt, etwa auf Debian oder Ubuntu:
#   1. Überall haustechnik.example.org durch den eigenen Namen ersetzen. Läuft
#      OpenGewerk auf demselben Server, braucht jede Anwendung ihren eigenen.
#   2. Das Zertifikat holen, solange die Standardseite auf Port 80 antwortet:
#        certbot certonly --webroot -w /var/www/html -d haustechnik.example.org
#   3. Die Datei als /etc/nginx/conf.d/opengewerk-haustechnik.conf ablegen, dann
#        nginx -t && systemctl reload nginx
#
# Security-Header setzt diese Datei bewusst keine: das tut die Anwendung
# selbst, ein zweites Mal wären sie falsch. Zwischengespeichert wird auch nichts.

# Die Anwendung lauscht nur auf 127.0.0.1. Der Port ist HAUSTECHNIK_PORT aus
# docker/.env; wer ihn dort geändert hat, ändert ihn hier.
upstream opengewerk_haustechnik {
    server 127.0.0.1:23800;
}

server {
    listen 80;
    listen [::]:80;
    # Der Name, unter dem die Instanz im Browser geöffnet wird.
    server_name haustechnik.example.org;

    # Beim Erneuern legt certbot hier seine Antwort ab; derselbe Ordner wie bei
    # -w oben.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Derselbe Name wie oben.
    server_name haustechnik.example.org;

    # Wo certbot das Zertifikat ablegt, mit dem eigenen Namen im Pfad.
    ssl_certificate     /etc/letsencrypt/live/haustechnik.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haustechnik.example.org/privkey.pem;

    # Host und Protokoll, wie der Browser sie sah, und X-Forwarded-For um die
    # Adresse des Clients ergänzt, nicht nur durchgereicht: danach zählen die
    # Grenzen je Adresse. Die Zeilen stehen nur hier. Bekommt ein location-Block
    # unten ein eigenes proxy_set_header, erbt er diese drei nicht mehr und
    # braucht sie dann alle selbst.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Ein Druck darf dauern: der Renderer bekommt für ein PDF bis zu 60
    # Sekunden, und das Buch einer Anlage oder das Verzeichnis mit den
    # Nachweisen dahinter druckt jeden Nachweis, der noch keinen Druck hat.
    # nginx bräche ohne Angabe nach 60 Sekunden mit 504 ab.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Überall 2 MB, groß nur, wo eine Datei kommt; die Grenze dort setzt die
    # Anwendung selbst, mit einem Satz dazu.
    client_max_body_size 2m;

    location / {
        proxy_pass http://opengewerk_haustechnik;
    }

    # Dokumente und andere Dateien für die Ablage, bis 25 MB.
    location /files/ {
        client_max_body_size 50m;
        proxy_pass http://opengewerk_haustechnik;
    }

    # Der Postausgang eines Geräts, bis 8 MB je Übertragung.
    location = /sync {
        client_max_body_size 50m;
        proxy_pass http://opengewerk_haustechnik;
    }

    # Import aus Tabellen: die Tabelle bis 10 MB, mit ihrer Zuordnung bis 16 MB.
    location /imports/ {
        client_max_body_size 50m;
        proxy_pass http://opengewerk_haustechnik;
    }

    # Das Foto einer Meldung, bis 25 MB.
    location /fault-reports/photos/ {
        client_max_body_size 50m;
        proxy_pass http://opengewerk_haustechnik;
    }

    # Der Nachweis einer Qualifikation, bis 25 MB.
    location /qualifications/certificates/ {
        client_max_body_size 50m;
        proxy_pass http://opengewerk_haustechnik;
    }

    # Das Foto einer Meldung über ein Etikett, bis 10 MB. Die Route braucht
    # keine Anmeldung, der Proxy lässt deshalb nur knapp mehr durch.
    location ~ ^/fault-reports/by-label/[^/]+/photo/ {
        client_max_body_size 12m;
        proxy_pass http://opengewerk_haustechnik;
    }
}
