packages:
  - packages/*
  # The foundation every application of the organisation is built on. It lives
  # in the repository opengewerk and is embedded here as a submodule on a fixed
  # commit (ADR 0010 there, ADR 0001 here). Its packages are members of this
  # workspace: their dependencies are in this lockfile, and they are built
  # before the packages that need them. Only `packages/platform/*`: the
  # packages of the Handwerkersoftware beside them are deliberately not
  # members, so that an import of one of them fails as a missing module.
  - upstream/opengewerk/packages/platform/*

# pnpm holds back freshly published versions until they have been out for a
# while. That is the protection against a hijacked npm account, where the
# malicious version is usually found out and withdrawn within hours. Whoever
# needs a version still inside that window enters it under
# minimumReleaseAgeExclude, and the better answer is the version before it.

# pnpm does not run the install scripts of other packages by itself. That is
# the protection against a package that does something other than installing
# while it installs. esbuild comes in through drizzle-kit, which the server
# side of the foundation uses to write the tables of a first migration, and it
# does not need its script: its binary sits in an optional package per
# platform. The same entry as in the repository the foundation comes from.
allowBuilds:
  esbuild: false

# Overrides that move a transitive dependency off a version with a published
# advisory, as long as the package that pulls it in has not moved itself.
# Each one is bounded to the affected versions, so that it neither lowers a
# version that is already fixed nor touches the untouched majors (minimatch
# 5 under filelist). Remove an entry once its parent requires a fixed version.
overrides:
  # GHSA-g3hv-75wg-m249, under @eslint/config-array and typescript-estree.
  'minimatch@>=7.0.0 <11.0.1': 11.0.4
  # GHSA-3g3m-2fjr-6pw4, under workbox-build 7.4.1, which still asks for ^11.
  'glob@>=9.0.0 <14.0.2': 14.0.3
  # GHSA-67mh-4wv8-2f99, under @esbuild-kit/core-utils of drizzle-kit. 0.25 is
  # the line drizzle-kit itself requires, so both resolve to one esbuild.
  'esbuild@<0.25.0': 0.25.12
  # GHSA-q7qp-rjg7-q26m, under @nestjs/platform-express 12.0.3. Nest itself
  # stays on the version of the foundation in the submodule, so that the tree
  # holds one Nest; the foundation moves to 12.3.3 with the next lift.
  'multer@>=2.0.0 <2.5.0': 2.5.0
  # GHSA-gcqx-w48m-w2h4 has no fixed version. @rollup/plugin-node-resolve only
  # copies its own defaults with it; the patch below does that with
  # structuredClone, and this entry drops deepmerge from the tree.
  '@rollup/plugin-node-resolve>deepmerge': '-'

patchedDependencies:
  '@rollup/plugin-node-resolve@16.0.3': patches/@rollup__plugin-node-resolve@16.0.3.patch
