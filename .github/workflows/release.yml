name: Release

# A release is a tag v<major>.<minor>.<patch> on a commit of main (#136). It
# builds the two images an installation runs, for x86_64 and ARM64, pushes
# them to ghcr.io/opengewerk under the version, signs them without a key
# through Sigstore, and writes the release page with the section of
# CHANGELOG.md for that version and the installation kit that
# docker/pack-kit.sh packs: the folder docker/ with the version in its
# compose.yaml and what the start of the foundation needs beside it, so that
# "sh docker/start.sh" pulls this release instead of building. The same as
# the workflow of OpenGewerk, with the names of this application.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Every action from outside GitHub is pinned to a commit, with its version in a
# comment: this job may push images and holds the identity they are signed
# with, and a tag is whatever its owner points it at next. Dependabot moves the
# pins and the comments along.

jobs:
  release:
    name: Abbilder veröffentlichen und Release schreiben
    runs-on: ubuntu-latest
    permissions:
      # The release page and its kit.
      contents: write
      # The two images in ghcr.io.
      packages: write
      # The identity Sigstore signs with, instead of a key someone keeps.
      id-token: write

    steps:
      - name: Repository mit dem Fundament auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          # Nothing after this step talks to git, and gh gets its token
          # through GH_TOKEN; the build does not need a write token on disk.
          persist-credentials: false

      - name: Fassung aus dem Tag lesen
        id: version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Der Tag $GITHUB_REF_NAME hat nicht die Form v1.2.3." >&2
            exit 1
          fi

          # A release is what main holds, not a branch somebody tagged.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Der Tag $GITHUB_REF_NAME steht nicht auf einem Stand von main." >&2
            exit 1
          fi

          # The release page is written from the changelog; without a section
          # for the version there is nothing to say what it brings.
          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md hat keinen Abschnitt [$version]." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ARM64 through emulation, as in OpenGewerk: a Raspberry Pi or an ARM
      # NAS can then pull a release like any other machine. The database and
      # the renderer come for both already.
      - name: QEMU für ARM64 einrichten
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: In ghcr.io anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Anwendung bauen und veröffentlichen
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/opengewerk/opengewerk-haustechnik:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/opengewerk/opengewerk-haustechnik
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      # The backup of the foundation, under the name of this application: its
      # archives are named after this database, and the image is the one the
      # compose file of this application names.
      - name: Sicherung bauen und veröffentlichen
        id: backup
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: upstream/opengewerk/docker/backup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/opengewerk/opengewerk-haustechnik-backup:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/opengewerk/opengewerk-haustechnik
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Cosign bereitstellen
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest and not by tag: a tag names whatever was pushed last,
      # a digest names these bytes. --recursive signs the image of each
      # platform as well as the list that names them.
      - name: Abbilder signieren
        env:
          APP: ghcr.io/opengewerk/opengewerk-haustechnik@${{ steps.app.outputs.digest }}
          BACKUP: ghcr.io/opengewerk/opengewerk-haustechnik-backup@${{ steps.backup.outputs.digest }}
        run: |
          set -eu
          cosign sign --yes --recursive "$APP"
          cosign sign --yes --recursive "$BACKUP"

      - name: Installationspaket packen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh docker/pack-kit.sh "$VERSION" .

      - name: Release schreiben
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          set -eu
          python3 .github/release-notes.py > notes.md

          gh release create "v$VERSION" \
            --verify-tag \
            --title "OpenGewerk Haustechnik $VERSION" \
            --notes-file notes.md \
            "opengewerk-haustechnik-$VERSION.tar.gz" \
            "opengewerk-haustechnik-$VERSION.tar.gz.sha256"
