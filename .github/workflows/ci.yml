name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  encoding:
    name: Kodierung und Zeilenenden
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Textdateien auf UTF-8 ohne BOM und LF prüfen
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          import sys

          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          raw = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              # A submodule is tracked as a single entry and is a directory on
              # disk. Its files are checked in the repository they belong to.
              if os.path.isdir(path):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              if content.startswith(b"\xef\xbb\xbf"):
                  problems.append(f"{path}: UTF-8 mit BOM")
              try:
                  content.decode("utf-8")
              except UnicodeDecodeError as error:
                  problems.append(f"{path}: kein gültiges UTF-8 ({error})")
                  continue
              if b"\r\n" in content:
                  problems.append(f"{path}: enthält CRLF-Zeilenenden")

          if problems:
              print("Gefundene Probleme:")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Alle Textdateien sind UTF-8 ohne BOM und benutzen LF.")
          PYTHON

  typography:
    name: Schreibweise
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Auf Gedankenstriche prüfen
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          import sys

          # Em dash and en dash are unwanted across the project, number ranges
          # included: those take a plain hyphen (25-75, Z1-Z3). The reason is
          # written down in the CLAUDE.md of the project folder.
          DASHES = {chr(0x2013): "Halbgeviertstrich", chr(0x2014): "Geviertstrich"}
          EXEMPT = {"LICENSE"}
          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          raw = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path in EXEMPT or path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              # A submodule is tracked as a single entry and is a directory on
              # disk. Its files are checked in the repository they belong to.
              if os.path.isdir(path):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), start=1):
                  for character, label in DASHES.items():
                      if character in line:
                          problems.append(f"{path}:{number}: {label} in: {line.strip()}")
                          break

          if problems:
              print("Gedankenstriche gefunden. Ersetze sie je nach Satzbau durch")
              print("Doppelpunkt, Komma, Semikolon oder Punkt, bei Zahlenbereichen")
              print("durch einen einfachen Bindestrich.")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Keine Gedankenstriche gefunden.")
          PYTHON

      - name: Auf umgeschriebene Umlaute prüfen
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import subprocess
          import sys

          # German text keeps its real characters, so "ae" where an "ä" belongs is a
          # mistake. The reason this needs a check rather than good intentions is the
          # same as for the dashes above: a file delivered from outside brings tidied up
          # places back, all at once, and a diff of a whole file hides it.
          #
          # The words are written correctly here and transliterated at startup. That is
          # not a detour, it is what keeps this job from tripping over its own word
          # list: this file holds the proper spelling, the search runs on the other one.
          #
          # A list rather than a pattern on "ae|oe|ue", because those pairs sit in a
          # great many English words (value, queue, issue, guest, true) and a pattern on
          # them reports almost nothing but noise.
          #
          # "ss" for "ß" is only in here where it is unambiguous. "dass", "muss" and
          # "Fluss" are correct, and a rule on "ss" could not tell those from "Straße".
          GERMAN_WORDS = (
              "hält häng häuf hätt änder ähnlich währ wähl träg absätz fäll läuft "
              "längst täglich nächst spät mäßig gemäß erklär zähl stärk schwäch bänd "
              "länd männ gefähr anhäng beschränk bösartig nötig möglich öffn veröffent "
              "lösch lösung stör höchst höher größ könn schön ström wört zöger ökonom "
              "führ für über übung üblich müss prüf gründ würde verfüg zurück dürf tür "
              "gültig günstig büro gebühr spüren fünf kürz lücke stück schlüssel "
              "unterstütz berücksicht natürlich gerüst draußen straße größe maßnahme "
              "schließ außer grün gefüll füllung"
          ).split()

          TRANSLITERATION = {"ä": "ae", "ö": "oe", "ü": "ue", "ß": "ss"}


          def transliterate(word):
              for character, replacement in TRANSLITERATION.items():
                  word = word.replace(character, replacement)
              return word


          STEMS = [transliterate(word) for word in GERMAN_WORDS]

          # Where ASCII is right and stays right, and where none of the rules below
          # already covers it. A list on purpose, so that a second entry is a decision in
          # a diff and not a line nobody looked at twice. A word in here is accepted
          # everywhere, this file included.
          ALLOWED = {
              # The id field of the issue templates, an identifier and not prose.
              "pruefung",
          }

          EXEMPT = {"LICENSE"}
          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          WORD = re.compile(r"[A-Za-zÄÖÜäöüß]+")
          # A chunk without whitespace that carries a path, a file name or an address.
          # None of that is prose and all of it is deliberately ASCII: a file is not
          # called "0008-plugin-system-für-gewerke.md", and the local part of a mail
          # address carries no umlaut.
          NOT_PROSE = re.compile(r"[/\\@]|\.[A-Za-z0-9]{1,5}\b")


          def offending_words(line):
              for chunk in line.split():
                  if NOT_PROSE.search(chunk):
                      continue
                  for match in WORD.finditer(chunk):
                      word = match.group(0)
                      lowered = word.lower()
                      if lowered in ALLOWED:
                          continue
                      # An abbreviation such as GAEB is spelled without an umlaut.
                      if word.isupper():
                          continue
                      if any(stem in lowered for stem in STEMS):
                          yield word


          raw = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path in EXEMPT or path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              # A submodule is tracked as a single entry and is a directory on
              # disk. Its files are checked in the repository they belong to.
              if os.path.isdir(path):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              for number, line in enumerate(text.splitlines(), start=1):
                  for word in offending_words(line):
                      problems.append(f"{path}:{number}: {word} in: {line.strip()}")
                      break

          if problems:
              print("Umgeschriebene Umlaute gefunden. In den Text gehören die echten")
              print("Zeichen: ä ö ü Ä Ö Ü ß. Ist ASCII an der Stelle richtig, weil das Wort")
              print("ein Bezeichner ist, gehört es in die Liste ALLOWED in diesem Job.")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Keine umgeschriebenen Umlaute gefunden.")
          PYTHON

  check:
    name: Typprüfung, Lint und Tests
    runs-on: ubuntu-latest
    steps:
      # The foundation is a submodule on a fixed commit (ADR 0010 in the
      # repository opengewerk). Without it the workspace has no packages of the
      # foundation, and the install fails on a lockfile that names them.
      - name: Repository mit dem Fundament auschecken
        uses: actions/checkout@v7
        with:
          submodules: true

      # A branch of the foundation disappears once it is merged, and a
      # repository pointing at one of its commits could no longer be cloned
      # (ADR 0001, point 9). While a change to the foundation is being built,
      # a branch here may point at a branch there; this step keeps it from
      # being merged before the other side is.
      - name: Das Fundament steht auf einem Commit seines main
        run: |
          cd upstream/opengewerk
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --quiet --unshallow origin main
          else
            git fetch --quiet origin main
          fi
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Das Submodul zeigt auf $(git rev-parse --short HEAD), einen Commit auf main des Fundaments."
          else
            echo "Das Submodul zeigt auf $(git rev-parse --short HEAD). Dieser Commit liegt nicht auf main"
            echo "des Repositorys opengewerk. Erst dort mergen, dann hier den Zeiger auf den"
            echo "gemergten Commit setzen."
            exit 1
          fi

      - name: pnpm über Corepack bereitstellen
        run: corepack enable

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      # The application compiles the packages of the foundation with its own
      # tools, so it keeps the same versions as the repository they come from.
      - name: Werkzeuge wie im Fundament
        run: pnpm run check:toolchain

      - name: Bauen
        run: pnpm run build

      - name: Typprüfung
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Formatierung
        run: pnpm run format:check

      - name: Tests
        run: pnpm run test
