name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  encoding:
    name: Kodierung und Zeilenenden
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Textdateien auf UTF-8 ohne BOM und LF prüfen
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          import sys

          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          raw = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              # A submodule is tracked as a single entry and is a directory on
              # disk. Its files are checked in the repository they belong to.
              if os.path.isdir(path):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              if content.startswith(b"\xef\xbb\xbf"):
                  problems.append(f"{path}: UTF-8 mit BOM")
              try:
                  content.decode("utf-8")
              except UnicodeDecodeError as error:
                  problems.append(f"{path}: kein gültiges UTF-8 ({error})")
                  continue
              if b"\r\n" in content:
                  problems.append(f"{path}: enthält CRLF-Zeilenenden")

          if problems:
              print("Gefundene Probleme:")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Alle Textdateien sind UTF-8 ohne BOM und benutzen LF.")
          PYTHON

  typography:
    name: Schreibweise
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Auf Gedankenstriche prüfen
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          import sys

          # Em dash and en dash are unwanted across the project, number ranges
          # included: those take a plain hyphen (25-75, Z1-Z3). The reason is
          # written down in the CLAUDE.md of the project folder.
          DASHES = {chr(0x2013): "Halbgeviertstrich", chr(0x2014): "Geviertstrich"}
          EXEMPT = {"LICENSE"}
          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          raw = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path in EXEMPT or path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              # A submodule is tracked as a single entry and is a directory on
              # disk. Its files are checked in the repository they belong to.
              if os.path.isdir(path):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), start=1):
                  for character, label in DASHES.items():
                      if character in line:
                          problems.append(f"{path}:{number}: {label} in: {line.strip()}")
                          break

          if problems:
              print("Gedankenstriche gefunden. Ersetze sie je nach Satzbau durch")
              print("Doppelpunkt, Komma, Semikolon oder Punkt, bei Zahlenbereichen")
              print("durch einen einfachen Bindestrich.")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Keine Gedankenstriche gefunden.")
          PYTHON

      - name: Auf umgeschriebene Umlaute prüfen
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import subprocess
          import sys

          # German text keeps its real characters, so "ae" where an "ä" belongs is a
          # mistake. The reason this needs a check rather than good intentions is the
          # same as for the dashes above: a file delivered from outside brings tidied up
          # places back, all at once, and a diff of a whole file hides it.
          #
          # The words are written correctly here and transliterated at startup. That is
          # not a detour, it is what keeps this job from tripping over its own word
          # list: this file holds the proper spelling, the search runs on the other one.
          #
          # A list rather than a pattern on "ae|oe|ue", because those pairs sit in a
          # great many English words (value, queue, issue, guest, true) and a pattern on
          # them reports almost nothing but noise.
          #
          # "ss" for "ß" is only in here where it is unambiguous. "dass", "muss" and
          # "Fluss" are correct, and a rule on "ss" could not tell those from "Straße".
          GERMAN_WORDS = (
              "hält häng häuf hätt änder ähnlich währ wähl träg absätz fäll läuft "
              "längst täglich nächst spät mäßig gemäß erklär zähl stärk schwäch bänd "
              "länd männ gefähr anhäng beschränk bösartig nötig möglich öffn veröffent "
              "lösch lösung stör höchst höher größ könn schön ström wört zöger ökonom "
              "führ für über übung üblich müss prüf gründ würde verfüg zurück dürf tür "
              "gültig günstig büro gebühr spüren fünf kürz lücke stück schlüssel "
              "unterstütz berücksicht natürlich gerüst draußen straße größe maßnahme "
              "schließ außer grün gefüll füllung"
          ).split()

          TRANSLITERATION = {"ä": "ae", "ö": "oe", "ü": "ue", "ß": "ss"}


          def transliterate(word):
              for character, replacement in TRANSLITERATION.items():
                  word = word.replace(character, replacement)
              return word


          STEMS = [transliterate(word) for word in GERMAN_WORDS]

          # Where ASCII is right and stays right, and where none of the rules below
          # already covers it. A list on purpose, so that a second entry is a decision in
          # a diff and not a line nobody looked at twice. A word in here is accepted
          # everywhere, this file included.
          ALLOWED = {
              # The id field of the issue templates, an identifier and not prose.
              "pruefung",
              # The addresses of the fault reports (#331) where they stand without a
              # slash: a settings key, a search parameter and the boards' functions.
              "stoerung",
              "stoerungen",
              "stoermeldung",
          }

          EXEMPT = {"LICENSE"}
          BINARY_EXTENSIONS = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf",
          )

          WORD = re.compile(r"[A-Za-zÄÖÜäöüß]+")
          # A chunk without whitespace that carries a path, a file name or an address.
          # None of that is prose and all of it is deliberately ASCII: a file is not
          # called "0008-plugin-system-für-gewerke.md", and the local part of a mail
          # address carries no umlaut.
          NOT_PROSE = re.compile(r"[/\\@]|\.[A-Za-z0-9]{1,5}\b")


          def offending_words(line):
              for chunk in line.split():
                  if NOT_PROSE.search(chunk):
                      continue
                  for match in WORD.finditer(chunk):
                      word = match.group(0)
                      lowered = word.lower()
                      if lowered in ALLOWED:
                          continue
                      # An abbreviation such as GAEB is spelled without an umlaut.
                      if word.isupper():
                          continue
                      if any(stem in lowered for stem in STEMS):
                          yield word


          raw = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout
          problems = []

          for entry in raw.split(b"\0"):
              if not entry:
                  continue
              path = entry.decode("utf-8", "surrogateescape")
              if path in EXEMPT or path.lower().endswith(BINARY_EXTENSIONS):
                  continue
              # A submodule is tracked as a single entry and is a directory on
              # disk. Its files are checked in the repository they belong to.
              if os.path.isdir(path):
                  continue
              with open(path, "rb") as handle:
                  content = handle.read()
              if b"\0" in content:
                  continue
              try:
                  text = content.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              for number, line in enumerate(text.splitlines(), start=1):
                  for word in offending_words(line):
                      problems.append(f"{path}:{number}: {word} in: {line.strip()}")
                      break

          if problems:
              print("Umgeschriebene Umlaute gefunden. In den Text gehören die echten")
              print("Zeichen: ä ö ü Ä Ö Ü ß. Ist ASCII an der Stelle richtig, weil das Wort")
              print("ein Bezeichner ist, gehört es in die Liste ALLOWED in diesem Job.")
              for line in problems:
                  print(f"  {line}")
              sys.exit(1)

          print("Keine umgeschriebenen Umlaute gefunden.")
          PYTHON

  check:
    name: Typprüfung, Lint und Tests
    runs-on: ubuntu-latest

    # The tests of the foundation's database code run against a real
    # PostgreSQL, not an imitation: what they check are policies, grants,
    # triggers and uuidv7(), and that is exactly the part an imitation does
    # differently from the real thing. The same address as
    # docker/compose.test.yaml, which is what scripts/run-tests.js points every
    # package at.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: haustechnik
          POSTGRES_PASSWORD: haustechnik
          POSTGRES_DB: haustechnik_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U haustechnik -d haustechnik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # A second one for the database tests of the foundation, so that they
      # run beside those of the application instead of before them (#192):
      # on one database each would empty the schema under the other, and one
      # after the other they took twelve of the job's thirteen minutes.
      postgres-foundation:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: haustechnik
          POSTGRES_PASSWORD: haustechnik
          POSTGRES_DB: haustechnik_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U haustechnik -d haustechnik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # The foundation is a submodule on a fixed commit (ADR 0010 in the
      # repository opengewerk). Without it the workspace has no packages of the
      # foundation, and the install fails on a lockfile that names them.
      - name: Repository mit dem Fundament auschecken
        uses: actions/checkout@v7
        with:
          submodules: true

      # A branch of the foundation disappears once it is merged, and a
      # repository pointing at one of its commits could no longer be cloned
      # (ADR 0001, point 9). While a change to the foundation is being built,
      # a branch here may point at a branch there; this step keeps it from
      # being merged before the other side is.
      - name: Das Fundament steht auf einem Commit seines main
        run: |
          cd upstream/opengewerk
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --quiet --unshallow origin main
          else
            git fetch --quiet origin main
          fi
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Das Submodul zeigt auf $(git rev-parse --short HEAD), einen Commit auf main des Fundaments."
          else
            echo "Das Submodul zeigt auf $(git rev-parse --short HEAD). Dieser Commit liegt nicht auf main"
            echo "des Repositorys opengewerk. Erst dort mergen, dann hier den Zeiger auf den"
            echo "gemergten Commit setzen."
            exit 1
          fi

      - name: pnpm über Corepack bereitstellen
        run: corepack enable

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      # The application compiles the packages of the foundation with its own
      # tools, so it keeps the same versions as the repository they come from.
      - name: Werkzeuge wie im Fundament
        run: pnpm run check:toolchain

      # Building checks the packages under pakete/ as well: the catalogue
      # package refuses to write a bundle from a package with a fault, and the
      # list of what is wrong stands in the log of this step (ADR 0005).
      - name: Bauen
        run: pnpm run build

      # The database tests of the foundation on the second PostgreSQL, started
      # as soon as the build is there and waited for after the other tests.
      # `--only` leaves out what turbo.json runs before a task: the build has
      # run, and the order that keeps both test runs off one database is not
      # needed with two. Locally `pnpm run test` keeps that order on the one
      # test database.
      - name: Tests des Fundaments mit Datenbank starten
        id: foundation-tests
        env:
          DATABASE_URL: postgres://haustechnik:haustechnik@127.0.0.1:5435/haustechnik_test
        run: |
          nohup sh -c 'pnpm exec turbo run test --only --filter=@opengewerk/platform-server; echo $? > "$RUNNER_TEMP/foundation-tests.status"' \
            > "$RUNNER_TEMP/foundation-tests.log" 2>&1 &

      # A version of an entry that is merged is what a confirmed duty or a
      # filled form names, so it stays as it is, byte for byte (ADR 0005,
      # point 16). Only a pull request has a main to compare with; the base is
      # fetched on its own, because the checkout holds the merge commit alone.
      - name: Gemergte Fassungen der Pakete unverändert
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          pnpm --filter @opengewerk/haustechnik-catalogue run compare FETCH_HEAD

      # ADR 0004 in the repository opengewerk asks for a bundle budget per entry
      # and names a number for the entry on site; the tool is the foundation's.
      - name: Bündelbudget je Einstieg
        run: pnpm --filter @opengewerk/haustechnik-web run budget

      # A tenant is a "Betreiber" here, whoever leads one the "Leitung", and the
      # entry on site "Vor Ort" (ADR 0001, point 11). Checked on what a browser
      # loads, the build, so that a sentence that came along with an import is
      # found as well as one written here.
      - name: Wörter der Anwendung im Bau
        run: pnpm --filter @opengewerk/haustechnik-web run words

      - name: Typprüfung
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Formatierung
        run: pnpm run format:check

      - name: Tests
        run: pnpm run test --only '--filter=!@opengewerk/platform-server'

      - name: Tests des Fundaments mit Datenbank
        if: ${{ !cancelled() && steps.foundation-tests.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          while [ ! -f "$RUNNER_TEMP/foundation-tests.status" ]; do
            sleep 5
          done

          cat "$RUNNER_TEMP/foundation-tests.log"
          exit "$(cat "$RUNNER_TEMP/foundation-tests.status")"

  widths:
    name: Breiten und Auflösungen
    runs-on: ubuntu-latest

    # Every screen of both entries at the widths of the board "Breiten und
    # Auflösungen", from 320 to 3840 pixels, light and dark, and the job fails
    # as soon as a page is wider than its window, as in the repository
    # opengewerk (#29). The screens are found by following the links of the
    # preview, so a new one is checked without anybody adding it here. Every
    # kind of page is held to the rules of accessibility in the same walk
    # (#132): labels, roles, headings and contrast with axe-core, light and
    # dark, at a telephone and a desktop. A finding counts when a second
    # measurement of the page finds it again (#231). The name of the job
    # stays, since the protection of main asks for it by name.
    #
    # The browser is the image of the renderer in docker/compose.yaml, the
    # Chromium an installation prints with, on the network of the runner: the
    # preview listens on 127.0.0.1 and nowhere else, and a service container
    # would not reach it there.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: haustechnik
          POSTGRES_PASSWORD: haustechnik
          POSTGRES_DB: haustechnik_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U haustechnik -d haustechnik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Repository mit dem Fundament auschecken
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Browser wie im Betrieb starten
        run: |
          set -euo pipefail
          image=$(sed -n '/^  renderer:$/{n;s/^ *image: //p;}' docker/compose.yaml)

          if [ -z "$image" ]; then
            echo "In docker/compose.yaml steht kein Abbild für den Renderer."
            exit 1
          fi

          echo "Browser: $image"
          docker run -d --rm --name browser --network host -e TOKEN=probe -e TIMEOUT=1800000 "$image"

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:3000/json/version?token=probe"; then
              exit 0
            fi
            sleep 2
          done

          echo "Der Browser ist nach einer Minute nicht erreichbar."
          exit 1

      - name: pnpm über Corepack bereitstellen
        run: corepack enable

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Vorschau starten
        run: |
          set -euo pipefail
          # Builds the interface, empties and migrates haustechnik_preview in
          # the database above and plants the sample operator. The line below
          # is printed once all of it is there.
          nohup pnpm run preview > "$RUNNER_TEMP/preview.log" 2>&1 &

          for _ in $(seq 1 90); do
            if grep -q "Die Vorschau läuft unter" "$RUNNER_TEMP/preview.log"; then
              exit 0
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/preview.log"
          echo "Die Vorschau ist nach drei Minuten nicht gestartet."
          exit 1

      # Both entries with their script cut off, the way a connection that
      # breaks or a browser that drops a request leaves them: the page loads
      # itself anew once, and says so where that does not help (#279).
      - name: Einstieg, dessen Skript nicht ankommt
        run: pnpm --filter @opengewerk/haustechnik-web run entries
        env:
          WIDTHS_BROWSER: ws://127.0.0.1:3000?token=probe&timeout=1800000
          WIDTHS_ADDRESS: http://127.0.0.1:23800

      - name: Jede Seite bei jeder Breite
        run: pnpm --filter @opengewerk/haustechnik-web run widths
        env:
          WIDTHS_BROWSER: ws://127.0.0.1:3000?token=probe&timeout=1800000
          WIDTHS_ADDRESS: http://127.0.0.1:23800

      # Also after a green run that left photographs: of what only one of two
      # measurements of a page found (#231), which fails nothing and is the
      # only trace of a page that did not start.
      - name: Aufnahmen bei einem Befund
        if: failure() || hashFiles('packages/web/widths-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: widths-report
          path: |
            packages/web/widths-report
            ${{ runner.temp }}/preview.log
          if-no-files-found: ignore

  # The three runs on a whole stack call their steps from the foundation's
  # docker/test-stack.sh (opengewerk-haustechnik#14), against the folder of
  # this application: APPLICATION_DIRECTORY names it, and what the steps need
  # to know about this application beyond compose.yaml and application.env is
  # in docker/test-material.sh. The names of the steps are the ones the runs in
  # the repository opengewerk take. The checks of the scripts themselves
  # (test-setup.sh, test-start.sh, test-backup.sh) run there, where the
  # scripts are changed.
  operations:
    name: Betrieb über Docker Compose
    runs-on: ubuntu-latest
    env:
      APPLICATION_DIRECTORY: ${{ github.workspace }}/docker

    steps:
      - name: Repository mit dem Fundament auschecken
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Jeder Dienst begrenzt seine Protokolle
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh log-limits

      - name: Jeder Dienst gibt seine Rechte ab, die Anwendung hat eine Speichergrenze, der Renderer ein eigenes Netz
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh hardening

      - name: Jedes Abbild und jede Basis per Digest, die Sicherung auf dem Abbild der Datenbank
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh base-images

      - name: Vorlagen für den Reverse Proxy prüfen
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-proxy.sh proxy

      # What this application prints is built with the helpers of the
      # foundation and printed in its CI with the Chromium it pins. Both
      # compose files name the image by hand, with release and digest, so this
      # is the check that they name the same one: a submodule raised to a
      # newer renderer turns it red until the line here has followed.
      - name: Der Renderer ist der des Fundaments
        run: |
          python3 - <<'PYTHON'
          import re
          import sys


          def renderer(path):
              text = open(path, encoding="utf-8").read()
              found = re.search(r"^  renderer:\n\s+image: (\S+)$", text, re.M)
              return found.group(1) if found else None


          ours = renderer("docker/compose.yaml")
          theirs = renderer("upstream/opengewerk/docker/compose.yaml")

          if not ours or ours != theirs or "@sha256:" not in ours:
              print("Der Renderer aus docker/compose.yaml ist nicht der des Fundaments, mit Fassung und Prüfsumme:")
              print(f"  docker/compose.yaml:                     {ours}")
              print(f"  upstream/opengewerk/docker/compose.yaml: {theirs}")
              sys.exit(1)

          print(f"Renderer wie im Fundament: {ours}")
          PYTHON

      # The way an installation starts, with the one command the README
      # names: the image is built with the submodule, the .env filled in, the
      # database migrated and only then the containers started.
      - name: Stapel starten
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh start

      - name: Die .env ist ausgefüllt und nur für ihren Besitzer lesbar
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh env-file

      - name: Instanz antwortet mit migrierter Datenbank
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh answers

      - name: Die Ersteinrichtung verlangt den Einrichtungscode
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh first-run

      - name: Favicon und Icons beider Einstiege kommen als Bild
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh icons

      # The renderer belongs to the default stack (#96): COMPOSE_PROFILES in
      # the template switches it on. Asked from inside the application
      # container, through the function of the foundation the application
      # prints with, so address and token come from its environment and never
      # appear in this log. Chromium takes a few seconds after the container is
      # up, hence the retries.
      - name: Der Renderer läuft von Haus aus und druckt ein PDF
        working-directory: docker
        run: sh test-renderer.sh

      - name: Der Renderer erreicht die Anwendung und nicht die Datenbank
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh print-network

      - name: Speicherbedarf im Leerlauf melden
        working-directory: docker
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}'

      - name: Protokolle bei einem Fehlschlag
        if: failure()
        working-directory: docker
        run: docker compose logs

      - name: Aufräumen
        if: always()
        working-directory: docker
        run: docker compose down --volumes

  backup:
    name: Sicherung und Rückspielen
    runs-on: ubuntu-latest
    env:
      APPLICATION_DIRECTORY: ${{ github.workspace }}/docker

    steps:
      - name: Repository mit dem Fundament auschecken
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Zugangsdaten und Schlüsselpaar erzeugen
        working-directory: docker
        run: |
          sh ../upstream/opengewerk/docker/test-stack.sh setup
          sh ../upstream/opengewerk/docker/test-stack.sh keys

      - name: Stapel starten
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh up

      - name: Eine leere Instanz sichert der Zeitplan nicht
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh skips-empty

      - name: Daten und Dateien anlegen
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh seed

      - name: Stand vor der Sicherung festhalten
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh snapshot

      - name: Sicherung erstellen
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh backup

      # The container of the application reads the record of the last backup,
      # and the route behind "Einstellungen", "Sicherung" names it, asked by
      # an account of the Leitung (#80, #127; after_record in test-material.sh).
      - name: Die Anwendung liest, wann die Sicherung fertig wurde
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh record

      - name: Datenplatte verlieren, Sicherung behalten
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh lose-data

      - name: Sicherung zurückspielen
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh restore

      # Besides the counts and the audit chains: the account from before the
      # backup signs in with its password (after_restore in test-material.sh).
      - name: Derselbe Datenbestand, dieselbe Audit-Kette
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh compare

      - name: Auf einer neuen Maschine ohne Verzeichnis der Sicherungen zurückspielen
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh new-machine

      - name: Eine beschädigte Sicherung wird abgelehnt
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh corrupt

      - name: Die nächtliche Sicherung holt nach
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh catch-up

      - name: Protokolle bei einem Fehlschlag
        if: failure()
        working-directory: docker
        run: docker compose logs

      # Every profile: one named on the command line stands in place of the
      # one the .env switches on, and the renderer would stay behind.
      - name: Aufräumen
        if: always()
        working-directory: docker
        run: docker compose --profile '*' down --volumes --remove-orphans

  update:
    name: Update einer laufenden Instanz
    runs-on: ubuntu-latest
    env:
      APPLICATION_DIRECTORY: ${{ github.workspace }}/docker

    steps:
      - name: Repository mit dem Fundament auschecken
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Zugangsdaten für den Lauf erzeugen
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh setup

      - name: Auf den Stand einer älteren Fassung zurücknehmen
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh rewind

      - name: Datenbank auf dem Stand der älteren Fassung
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh older

      - name: Daten anlegen und den Stand festhalten
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh seed-older

      - name: Aktualisieren, erst migrieren und dann tauschen
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh update

      - name: Derselbe Bestand auf dem neuen Stand
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh after-update

      - name: Eine fehlerhafte Migration bricht ab, die Instanz läuft weiter
        working-directory: docker
        run: sh ../upstream/opengewerk/docker/test-stack.sh broken-update

      - name: Protokolle bei einem Fehlschlag
        if: failure()
        working-directory: docker
        run: docker compose logs

      - name: Aufräumen
        if: always()
        working-directory: docker
        run: docker compose down --volumes --remove-orphans

  # This application beside an OpenGewerk on one machine (#15): both stacks at
  # once, apart in projects, ports, volumes and sessions, and this one removed
  # with its volumes without touching the other. OpenGewerk comes from the
  # submodule, built from the commit it points at. The steps stand with their
  # reasons in docker/test-beside.sh.
  beside:
    name: Neben OpenGewerk auf einem Server
    runs-on: ubuntu-latest

    steps:
      - name: Repository mit dem Fundament auschecken
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: OpenGewerk aus dem Submodul starten
        working-directory: docker
        run: sh test-beside.sh theirs

      - name: Die Haustechnik daneben starten
        working-directory: docker
        run: sh test-beside.sh ours

      - name: Eigene Ports und eigene Volumes
        working-directory: docker
        run: sh test-beside.sh apart

      - name: Eine Sitzung gilt nur bei ihrer Anwendung
        working-directory: docker
        run: sh test-beside.sh session

      - name: Die Haustechnik entfernen, OpenGewerk läuft weiter
        working-directory: docker
        run: sh test-beside.sh remove-ours

      - name: Protokolle bei einem Fehlschlag
        if: failure()
        run: |
          docker compose -f docker/compose.yaml logs
          docker compose -f upstream/opengewerk/docker/compose.yaml logs

      - name: Aufräumen
        if: always()
        run: |
          docker compose -f docker/compose.yaml --profile '*' down --volumes --remove-orphans
          docker compose -f upstream/opengewerk/docker/compose.yaml --profile '*' down --volumes --remove-orphans

  # The kit of a release (#136), packed as the workflow "Release" packs it and
  # started as an operator starts it: unpacked where no source lies beside it,
  # with the one command its page names, and the images of the version it
  # names. They are built here first under a version that no registry holds,
  # so that nothing is pulled and nothing built from the kit.
  kit:
    name: Installationspaket
    runs-on: ubuntu-latest
    env:
      VERSION: 0.0.0

    steps:
      - name: Repository mit dem Fundament auschecken
        uses: actions/checkout@v7
        with:
          submodules: true

      # As the release PR turns [Unreleased] into the section of a version:
      # the page takes the whole section where it fits and its introduction
      # with a link where it does not, and the page itself stays under the
      # 125000 characters GitHub takes.
      - name: Release-Seite aus dem CHANGELOG schreiben
        run: |
          python3 - <<'PYTHON'
          import importlib.util
          import sys

          spec = importlib.util.spec_from_file_location("notes", ".github/release-notes.py")
          notes = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(notes)

          changelog = open("CHANGELOG.md", encoding="utf-8").read().replace(
              "## [Unreleased]",
              "## [Unreleased]\n\n## [0.0.0] - 2026-01-01\n\nDie Einleitung einer Probefassung.",
              1,
          )
          page = notes.page(changelog, "0.0.0", "sha256:app", "sha256:backup")
          problems = [
              problem
              for problem, broken in [
                  ("länger als 125000 Zeichen", len(page) > 125_000),
                  ("ohne die Einleitung", "Die Einleitung einer Probefassung." not in page),
                  ("ohne den Abschnitt zur Installation", "## Installieren und aktualisieren" not in page),
                  ("ohne die Prüfung beider Signaturen", page.count("cosign verify") != 2),
                  ("mit Docker Hub, ohne dass gespiegelt wird", "auch auf Docker Hub" in page),
                  (
                      "ohne Docker Hub, wo gespiegelt wird",
                      "`opengewerk/opengewerk-haustechnik-backup:0.0.0`"
                      not in notes.page(changelog, "0.0.0", "sha256:app", "sha256:backup", True),
                  ),
              ]
              if broken
          ]

          if problems:
              print("Die Release-Seite ist " + ", ".join(problems) + ".")
              sys.exit(1)

          print(f"Release-Seite mit {len(page)} Zeichen.")
          PYTHON

      - name: Abbilder unter der Probefassung bauen
        run: |
          set -eu
          docker build -t "ghcr.io/opengewerk/opengewerk-haustechnik:$VERSION" -f Dockerfile .
          docker build -t "ghcr.io/opengewerk/opengewerk-haustechnik-backup:$VERSION" upstream/opengewerk/docker/backup

      - name: Paket packen
        run: sh docker/pack-kit.sh "$VERSION" "$RUNNER_TEMP/kit"

      - name: Paket ohne Quelltext daneben entpacken
        run: |
          set -eu
          cd "$RUNNER_TEMP/kit"
          sha256sum -c "opengewerk-haustechnik-$VERSION.tar.gz.sha256"
          mkdir "$RUNNER_TEMP/install"
          tar --no-same-owner -xzf "opengewerk-haustechnik-$VERSION.tar.gz" -C "$RUNNER_TEMP/install"

          # Nothing to build from: no source, no package, no Dockerfile of the
          # application.
          found=$(find "$RUNNER_TEMP/install" -name package.json -o -name '*.ts' -o -path '*/packages/*' -o -name Dockerfile -not -path '*/docker/backup/*')
          if [ -n "$found" ]; then
            echo "Im Paket liegt, was zum Bauen gehört:" >&2
            echo "$found" >&2
            exit 1
          fi

          # The templates for a reverse proxy travel with the kit: the README
          # sends whoever installs to them.
          for template in apache.conf nginx.conf; do
            if [ ! -f "$RUNNER_TEMP/install/opengewerk-haustechnik/docker/proxy/$template" ]; then
              echo "Im Paket fehlt docker/proxy/$template." >&2
              exit 1
            fi
          done

      - name: Mit einem Befehl starten
        working-directory: ${{ runner.temp }}/install/opengewerk-haustechnik
        env:
          HAUSTECHNIK_ADDRESS: http://127.0.0.1:23800
        run: sh docker/start.sh

      - name: Die Instanz läuft mit der Fassung des Pakets
        working-directory: ${{ runner.temp }}/install/opengewerk-haustechnik
        run: |
          set -eu
          health=$(curl --silent --fail http://127.0.0.1:23800/health)
          echo "Health: $health"
          test "$health" = "{\"status\":\"bereit\",\"database\":true,\"version\":\"$VERSION\"}"

          # Without a session a route with data refuses, here as from source.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:23800/staff)
          echo "GET /staff: $status"
          test "$status" = 401

          # Every image of this application is the one of the version.
          images=$(docker compose -f docker/compose.yaml images --format json | python3 -c '
          import json, sys
          rows = json.load(sys.stdin)
          names = {row["Repository"] + ":" + row["Tag"] for row in rows if "opengewerk-haustechnik" in row["Repository"]}
          print("\n".join(sorted(names)))
          ')
          echo "$images"
          test -n "$images"
          if echo "$images" | grep -v ":$VERSION\$"; then
            echo "Ein Abbild der Anwendung läuft nicht mit der Fassung $VERSION." >&2
            exit 1
          fi

      - name: Protokolle bei einem Fehlschlag
        if: failure()
        working-directory: ${{ runner.temp }}/install/opengewerk-haustechnik
        run: docker compose -f docker/compose.yaml logs

      - name: Aufräumen
        if: always()
        working-directory: ${{ runner.temp }}/install/opengewerk-haustechnik
        run: docker compose -f docker/compose.yaml --profile '*' down --volumes --remove-orphans || true
