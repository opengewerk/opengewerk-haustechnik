version: 2
updates:
  # The actions in the workflows. A version that nobody moves stays where it is
  # forever, and an action on an unmaintained runtime is a finding waiting to
  # happen.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The foundation, embedded as a submodule on a fixed commit (ADR 0001). A
  # security fix there reaches this application when the pointer moves, so
  # somebody has to move it: this proposes the newest commit of its main every
  # week. The pull request stays red until the lockfile has followed and, if
  # they moved there, the versions of the tools and of the dependencies both
  # sides share. It also stays red when a building block of the foundation
  # changed: this application then owes its database a migration that follows,
  # in the same pull request (ADR 0001, addendum of 02.10.2026).
  # The base of the image of the application, by its digest (#687 in the
  # repository opengewerk). The database in docker/compose.yaml is not on the
  # list on purpose: the backup is built from the submodule on the very same
  # image, so it moves when the submodule is raised, and "test-stack.sh
  # base-images" stays red until both name the same.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
