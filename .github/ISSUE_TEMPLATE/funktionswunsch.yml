name: Funktionswunsch
description: Eine neue Funktion oder eine Änderung am Konzept vorschlagen
title: "[Wunsch]: "
labels: ["Funktionswunsch"]
body:
  - type: markdown
    attributes:
      value: |
        Für offene Fragen und Ideen, die noch keinen konkreten Vorschlag haben,
        sind die Discussions der bessere Ort. Ein Issue lohnt sich, wenn du
        schon weißt, was du willst.

  - type: textarea
    id: problem
    attributes:
      label: Welches Problem löst der Vorschlag?
      description: Beschreibe die Situation aus dem Betriebsalltag, nicht die Lösung.
    validations:
      required: true

  - type: textarea
    id: vorschlag
    attributes:
      label: Wie soll es funktionieren?
    validations:
      required: true

  - type: textarea
    id: alternativen
    attributes:
      label: Welche Alternativen hast du bedacht?
    validations:
      required: false

  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      description: Grobe Einordnung, damit der Vorschlag beim richtigen Modul landet.
      options:
        - Architektur und Grundbausteine
        - Liegenschaften, Gebäude, Räume
        - Anlagen und Anlagenakte
        - Betreiberpflichten und Fristen
        - Prüfungen, Wartungen, Rundgänge
        - Mängel, Störmeldungen, Arbeitsaufträge
        - Zähler und Energie
        - Dokumente, Fremdfirmen, Verträge
        - Lager und Schlüssel
        - Pflichtenkatalog und Pakete
        - Anbindungen und Schnittstellen
        - Dokumentation
        - Weiß ich nicht
    validations:
      required: true

  - type: textarea
    id: rechtliches
    attributes:
      label: Rechtlicher Hintergrund
      description: Falls eine gesetzliche Anforderung dahintersteht, nenne sie mit Fundstelle (Paragraf, Norm mit Ausgabe, Frist).
    validations:
      required: false

  - type: checkboxes
    id: pruefung
    attributes:
      label: Vorab geprüft
      options:
        - label: Ich habe im Planungskonzept nachgesehen, ob der Punkt dort schon steht.
          required: true
        - label: Ich halte mich an den Verhaltenskodex der Organisation.
          required: true
